<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>E1 — Chat workspace</title><link rel="stylesheet" href="/workspace/xterm.css"><link rel="stylesheet" href="/workspace/style.css"><script defer src="/marked.js"></script><script defer src="/purify.js"></script><script defer src="/workspace/xterm.js"></script><script defer src="/workspace/xterm-addon-fit.js"></script><script defer src="/workspace/terminal.js"></script><script defer src="/workspace/app.js"></script></head>
<body>
<aside id="sidebar"><div class="brand"><img src="/logo.svg" alt="E1"><span>E1</span><button id="new-chat" title="New chat" aria-label="New chat">＋</button></div><input id="search" type="search" placeholder="Search chats" aria-label="Search chats"><nav id="chats" aria-label="Chats"></nav><button id="open-schedules" class="sidebar-action">Schedules</button><button id="open-updates" class="sidebar-action">Updates</button><div class="sidebar-bottom"><span class="local-dot"></span>Local workspace<button id="limits" title="Resource limits" aria-label="Resource limits">⚙</button></div></aside>
<main id="workspace"><header class="workspace-header"><div><strong id="title">New chat</strong><small id="folder"></small></div><select id="model" aria-label="Model"><option value="">Choose a model</option></select></header>
<div id="notice" role="status" hidden></div>
<div class="workspace-body"><section id="conversation" aria-label="Conversation"><div id="messages" aria-live="polite"></div><div id="empty"><img src="/logo.svg" alt=""><h1>What would you like to work on?</h1><p>Your files, Pages, and terminal stay beside the conversation.</p><button id="start-chat">Choose a workspace folder</button></div><div class="composer-wrap"><div class="activity-row"><div id="activity" role="status"></div><button id="resume" type="button" hidden>Resume</button></div><form id="composer"><textarea id="prompt" placeholder="Ask E1 to work on something…" aria-label="Message" rows="2"></textarea><div class="composer-actions"><div><button type="button" data-action="page">＋ Page</button><button type="button" data-action="file">File</button><button type="button" data-action="browser" hidden>Browser</button><button type="button" data-action="terminal">Terminal</button><button type="button" data-action="fork">Side chat</button></div><button id="stop" type="button" hidden>Stop</button><button id="send" type="submit" aria-label="Send message">↑</button></div></form><p class="composer-note">Commands run locally in your workspace.</p></div></section>
<div id="resize" role="separator" aria-label="Resize side panel" aria-orientation="vertical" tabindex="0" hidden></div><aside id="side-panel" aria-label="Workspace panels" hidden><nav id="tabs" aria-label="Open panels"></nav><div id="panel-content"></div></aside></div>
</main>
<dialog id="entry"><form id="entry-form"><h2 id="entry-title"></h2><label id="entry-label" for="entry-input"></label><input id="entry-input" autocomplete="off" required><p id="entry-description"></p><div><button type="button" id="entry-cancel">Cancel</button><button type="submit" id="entry-submit">Continue</button></div></form></dialog>
<dialog id="limit-dialog"><form id="limit-form"><h2>Resource limits</h2><p>Browser limits will apply when the browser host is connected.</p><label>Maximum browser tabs<input id="max-tabs" type="number" min="1" max="256" required></label><label>Active browser tabs<input id="active-tabs" type="number" min="1" max="256" required></label><label>Tool rounds per response<input id="tool-rounds" type="number" min="1" max="1000" required></label><div><button type="button" id="limit-cancel">Cancel</button><button type="submit">Save</button></div></form></dialog>
</body></html>
